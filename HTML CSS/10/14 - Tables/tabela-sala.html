<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        th{
            background-color: black;
            color: white;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>DIVISÃO DE TREINOS</p>

    <table border="2">
        <caption>DIVISÃO DE TREINOS</caption>

        <thead>
            <tr>
                <th colspan="2">Nome</th>
                <th>Idade</th>
                <th>Telefone</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="descanso">Pedro</td>
                <td>Silva</td>
                <td>17</td>
                <td rowspan="2">(85) 9 9999-9999</td>
            </tr>
            <tr>
                <td id="nome-vermelho">Isaac</td>
                <td>Uchiha</td>
                <td>17</td>
            </tr>
            <tr>
                <td class="descanso">Thalles</td>
                <td>Muller</td>
                <td>15</td>
                <td>(85) 9 8888-8888</td>
            </tr>
        </tbody>

    </table>
    
</body>
</html>
