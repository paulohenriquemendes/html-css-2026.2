<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox - Aula 01</title>
    <style>
        .papai{
            background-color: yellow;
            width: 450px;
            height: 100px;
            display: flex;
            flex-direction: row;
            justify-content: flex-end;
            align-items: center;
        }
        .filho{
            background-color: darkblue;
            color: white;
            width: 60px;
            height: 30px;
            margin: 10px;
            padding: 8px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .vovo{
            background-color: gray;
            height: 400px;
            width: 500px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="vovo">
        <strong>Avô do filhos:</strong>
        <div class="papai">
            <strong>Pai dos filhos:</strong>
            <div class="filho">Filho</div>
            <div class="filho">Filho</div>
        </div>

        <div class="papai">
            <strong>Pai dos filhos:</strong>
            <div class="filho">Filho</div>
            <div class="filho">Filho</div>
            <div class="filho">Filho</div>
        </div>

        <div class="papai">
            <strong>Pai dos filhos:</strong>
            <div class="filho">Filho</div>
        </div>
    </div>
    
</body>
</html>
