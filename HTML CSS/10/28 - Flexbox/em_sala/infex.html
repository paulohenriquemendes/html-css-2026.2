<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox - Aula 01</title>
    <style>
        .papai{
            border: 1px solid black;
            width: 500px;
            height: 300px;
            background-color: yellow;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-end;

        }
        .filho{
            background-color: darkblue;
            color: white;
            text-align: center;
            width: 50px;
            height: 20px;
            padding: 15px;
            margin: 6px
        }
    </style>
</head>
<body>
    <div class="papai">
        <div class="filho">
            Filho
        </div>
        <div class="filho">
            Filho
        </div>
    </div>
    
</body>
</html>
